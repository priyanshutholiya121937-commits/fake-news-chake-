<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TruthCheck AI - AI Fake News Detection System</title>
    <meta name="description" content="AI-powered news verification at your fingertips. Check articles or scan news photos with OCR and Machine Learning." />
    <meta property="og:title" content="TruthCheck AI - Intelligence Designed To Verify" />
    <meta property="og:description" content="Detect fake news with advanced NLP, TF-IDF, Machine Learning models and OCR camera scanning." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://db.onlinewebfonts.com/c/8cb707a9b8a73f8a7403336b861c3074?family=BubbledotICG-FinePos" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="bg">
      <video class="bg-video" autoplay muted loop playsinline>
        <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260809_012548_ef22562c-c0ae-4816-ad9d-f8922af4e6a7.mp4" type="video/mp4" />
      </video>
      <div class="bg-overlay"></div>
    </div>

    <div class="page" id="app-page">
      <header class="header">
        <a href="#" onclick="navigate('home'); return false;" class="logo-btn" aria-label="TruthCheck AI Home">
          <img src="images/logo.webp" alt="TruthCheck AI" width="52" height="52" class="logo-img" />
        </a>
        <nav class="nav-pill">
          <a href="#" onclick="navigate('home'); return false;" class="nav-link" id="nav-home">Home</a>
          <a href="#" onclick="navigate('text-check'); return false;" class="nav-link" id="nav-text-check">Check Text</a>
          <a href="#" onclick="navigate('image-scanner'); return false;" class="nav-link" id="nav-image-scanner">Scan News</a>
          <a href="#" onclick="navigate('history'); return false;" class="nav-link" id="nav-history">History</a>
          <a href="#" onclick="navigate('about'); return false;" class="nav-link" id="nav-about">About</a>
        </nav>
        <a href="#" onclick="navigate('image-scanner'); return false;" class="header-action">
          <i class="fa-solid fa-camera"></i><span>Scan Photo</span>
        </a>
        <button class="burger-btn" id="burger-btn" aria-label="Toggle navigation menu" aria-expanded="false">
          <span class="burger-bar"></span><span class="burger-bar"></span><span class="burger-bar"></span>
        </button>
      </header>

      <div class="flash-container" id="flash-container"></div>
      <div id="page-content"></div>

      <footer class="stats" id="app-footer" style="margin-top: auto;">
        <div class="stat-item anim" style="--d: 0.35s">
          <div class="stat-value-row"><span class="stat-icon">&lt;</span><span class="stat-value"><span class="stat-number" data-target="120" data-decimals="0">0</span><span class="stat-suffix">ms</span></span></div>
          <span class="stat-label">Inference Time</span>
        </div>
        <div class="stat-item anim" style="--d: 0.42s">
          <div class="stat-value-row"><span class="stat-icon">%</span><span class="stat-value"><span class="stat-number" data-target="96.77" data-decimals="2">0.00</span><span class="stat-suffix">%</span></span></div>
          <span class="stat-label">Model Accuracy</span>
        </div>
        <div class="stat-item anim" style="--d: 0.49s">
          <div class="stat-value-row"><span class="stat-icon">*</span><span class="stat-value"><span class="stat-number" data-target="24" data-decimals="0">0</span><span class="stat-suffix">/7</span></span></div>
          <span class="stat-label">Real-Time Verification</span>
        </div>
        <div class="stat-item anim" style="--d: 0.56s">
          <div class="stat-value-row"><span class="stat-icon">#</span><span class="stat-value"><span class="stat-number" data-target="50" data-decimals="0">0</span><span class="stat-suffix">k+</span></span></div>
          <span class="stat-label">Articles Analyzed</span>
        </div>
      </footer>
    </div>

    <div class="mobile-overlay" id="mobile-overlay" hidden></div>
    <div class="mobile-menu" id="mobile-menu" hidden>
      <a href="#" onclick="navigate('home'); closeMobileMenu(); return false;" class="mobile-nav-link" id="mobile-nav-home">Home</a>
      <a href="#" onclick="navigate('text-check'); closeMobileMenu(); return false;" class="mobile-nav-link" id="mobile-nav-text-check">Check Text</a>
      <a href="#" onclick="navigate('image-scanner'); closeMobileMenu(); return false;" class="mobile-nav-link" id="mobile-nav-image-scanner">Scan News</a>
      <a href="#" onclick="navigate('history'); closeMobileMenu(); return false;" class="mobile-nav-link" id="mobile-nav-history">History</a>
      <a href="#" onclick="navigate('about'); closeMobileMenu(); return false;" class="mobile-nav-link" id="mobile-nav-about">About</a>
    </div>

    <script src="js/_config.js"></script>
    <script src="js/main.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
